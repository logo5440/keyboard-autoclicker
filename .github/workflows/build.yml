name: Build Windows EXE and installer

# Runs when started by hand (Actions tab) or when a version tag such as v1.9.1 is pushed.
# A release is only ever created as a DRAFT: nothing is published until you click
# "Publish release" on GitHub yourself.
on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Also create a DRAFT release (not published)"
        type: boolean
        default: false
      version:
        description: "Version tag for the draft release, e.g. v1.9.1"
        type: string
        default: "v1.9.1"
  push:
    tags: ["v*"]

jobs:
  smoke-test:
    name: Start-up test (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Start the program and check that the window appears
        run: python tests/smoke_test.py
        timeout-minutes: 3

  build:
    needs: smoke-test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build the EXE
        run: >
          pyinstaller --noconfirm --clean --onefile --noconsole
          --name KeyboardAutoclicker --icon icon.ico --add-data "icon.ico;."
          --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 --hidden-import PIL._tkinter_finder
          keyboard_autoclicker.py
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build the installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardAutoclicker
          path: |
            dist/KeyboardAutoclicker.exe
            Output/KeyboardAutoclicker_Setup.exe
      - name: Create DRAFT release (not published)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.draft_release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Keyboard Autoclicker ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/KeyboardAutoclicker.exe
            Output/KeyboardAutoclicker_Setup.exe
