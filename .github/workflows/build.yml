name: Build Windows EXE and installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build the EXE
        run: >
          pyinstaller --noconfirm --clean --onefile --noconsole
          --name KeyboardAutoclicker --icon icon.ico --add-data "icon.ico;."
          --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 --hidden-import PIL._tkinter_finder
          keyboard_autoclicker.py
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build the installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardAutoclicker
          path: |
            dist/KeyboardAutoclicker.exe
            Output/KeyboardAutoclicker_Setup.exe
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/KeyboardAutoclicker.exe
            Output/KeyboardAutoclicker_Setup.exe
