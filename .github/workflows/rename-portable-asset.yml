name: One-off - rename portable asset of v1.9.1

# Renames KeyboardAutoclicker.exe to KeyboardAutoclicker_Portable.exe in the published
# release v1.9.1 (same file, new name) and refreshes the release notes.
# Started once by hand; this workflow file is removed again afterwards.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Rename the asset (identical file)
        run: |
          set -e
          gh release download v1.9.1 -R "$REPO" -p KeyboardAutoclicker.exe -D tmp
          sha256sum tmp/KeyboardAutoclicker.exe
          mv tmp/KeyboardAutoclicker.exe tmp/KeyboardAutoclicker_Portable.exe
          gh release upload v1.9.1 tmp/KeyboardAutoclicker_Portable.exe -R "$REPO"
          gh release delete-asset v1.9.1 KeyboardAutoclicker.exe -R "$REPO" -y
      - name: Refresh the release notes
        run: gh release edit v1.9.1 -R "$REPO" --notes-file RELEASE_NOTES.md
      - name: Show the result
        run: gh release view v1.9.1 -R "$REPO" --json assets --jq '.assets[] | .name + "  " + (.size|tostring)'
